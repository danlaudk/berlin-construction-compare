# Hand-maintained inputs for src/panel.py and src/levers.py.
#
# Every number here was extracted by a research agent from a primary source and is
# recorded in docs/research/ (see `source` per item below, and the `tag` V/S/I).
# This file exists because several of the stage-4 handoff datasets (Zensus 2011
# Gemeindeblätter per Bezirk, A I 3 2025 district XLSX, F I 1 2025 district XLSX,
# Zensus 2022 kleinräumige Bezirksregionen XLSX) are either PDF-only per-Bezirk
# documents (12 separate PDFs for 2011) or were already opened and transcribed by
# the research agents into docs/research/stage3a_gap_report.md and
# docs/research/consolidated_findings.md. Re-downloading and re-parsing those PDFs
# is a large effort for no gain in accuracy over numbers an agent already read
# directly from the source and cross-checked against the official Berlin totals
# (see stage3a_gap_report.md §1, "Berlin checks: ... Bezirk sums reproduce these
# exactly"). Per the handoff: "Be pragmatic: a complete panel from hand-maintained
# research tables beats a half-finished scraper."
#
# districts are the fixed 12-Bezirk order used throughout this repo (src/berlin.py
# DISTRICTS); "Berlin" is the aggregate row.

districts: &districts
  - Mitte
  - Friedrichshain-Kreuzberg
  - Pankow
  - Charlottenburg-Wilmersdorf
  - Spandau
  - Steglitz-Zehlendorf
  - Tempelhof-Schöneberg
  - Neukölln
  - Treptow-Köpenick
  - Marzahn-Hellersdorf
  - Lichtenberg
  - Reinickendorf

